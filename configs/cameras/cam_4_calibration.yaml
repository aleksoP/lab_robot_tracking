# Camera calibration for cam_4.
# PLACEHOLDER – replace with per-camera output from camera_calibration.

image_width: 1280
image_height: 720
camera_name: usb_camera3:_usb_camera3
camera_matrix:
  rows: 3
  cols: 3
  data: [640.0, 0.0, 640.0,
          0.0, 640.0, 360.0,
          0.0,   0.0,   1.0]
distortion_model: plumb_bob
